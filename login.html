<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discography</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            min-height: 100vh;
            display: flex;
        }

        a {
            text-decoration: none;
        }

        /* Left Side - Login */
        .login-side {
            flex: 1;
            background: #002219;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px 20px;
        }

        .login-container {
            border-radius: 16px;
            padding: 80px 80px;
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-container h2 {
            color: #ffffff;
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 30px;
            font-weight: 800;
        }

        .login-logo {
            width: 70px;
            height: 70px;
            margin: -100px auto 40px;
            border-radius: 8px;
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #a8a8a8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 100px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            padding-left: 5px;
            text-indent: 5px;
            text-align: left;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #008d67;
            box-shadow: 0 0 5px rgba(0, 141, 103, 0.3);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(90deg, #008d67 0%, #00be8c 100%);
            background-size: 200% 100%;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-position: right center;
            animation: colorShift 0.6s ease forwards;
        }

        .back-link {
            margin-top: 15px;
            text-align: center;
        }

        .back-link p {
            color: #a8a8a8;
            font-weight: 600;
            margin: 0;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #008d67;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
            font-size: 1em;
            padding: 0;
        }

        .toggle-btn:hover {
            color: #00be8c;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        /* Right Side - Info */
        .info-side {
            flex: 1.5;
            background: #000c09;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: left;
            padding: 60px 40px;
            text-align: left;
            color: white;
            position: relative;
        }

        .info-side h1 {
            color: rgb(255, 255, 255);
            font-size: 1.5em;
            font-weight: 700;
            text-align: left;
            letter-spacing: 2px;
            padding: 0;
            margin: 0 0 30px 40px;
            position: absolute;
            top: 60px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-side h2 {
            font-size: 3.5em;
            font-weight: 800;
            margin: 0 0 30px 50px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-side p {
            font-size: 1.2em;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 0 0 50px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            color: rgb(175, 175, 175);
        }

        @keyframes colorShift {
            0% {
                background-position: left center;
            }
            100% {
                background-position: right center;
            }
        }

        @media (max-width: 1024px) {
            body {
                flex-direction: column;
            }

            .login-side,
            .info-side {
                flex: 1;
                width: 100%;
            }

            .info-side h1 {
                max-width: 100%;
                font-size: 1.5em;
            }

            .info-side p {
                font-size: 1em;
            }

            .login-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Left Side - Info -->
    <div class="info-side">
        <a href="index.html"><h1><img src="logo.png" alt="Logo" class="logo">DISCOGRAPHY</h1></a>
        <h2>Join the Music Community.</h2>
        <p>Share your music taste with your friends.</p>
        <p>Style it in your own unique way.</p>
    </div>

    <!-- Right Side - Login/Signup -->
    <div class="login-side">
        <div class="login-container">
            <!-- Login Form -->
            <div id="loginForm" class="form-container active">
                <img src="logo.png" alt="Logo" class="login-logo">
                <h2>Welcome!</h2>
                <form>
                    <div class="form-group">
                        <label for="email">E-mail or Username</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="login-btn">Sign In</button>
                </form>
                <div class="back-link">
                    <p>Don't have an account? <button class="toggle-btn" onclick="toggleForm()">Sign Up</button></p>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="form-container">
                <img src="logo.png" alt="Logo" class="login-logo">
                <h2>Create Account</h2>
                <form>
                    <div class="form-group">
                        <label for="signup-email">E-mail</label>
                        <input type="email" id="signup-email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <input type="password" id="signup-confirm" name="confirm" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="login-btn">Create Account</button>
                </form>
                <div class="back-link">
                    <p>Already have an account? <button class="toggle-btn" onclick="toggleForm()">Sign In</button></p>
                </div>
            </div>
        </div>
    </div>

    <script>

        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            
            loginForm.classList.toggle('active');
            signupForm.classList.toggle('active');
        }
    </script>
</body>
</html>
