<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07130f">
    <title>Discography</title>
    <link rel="stylesheet" href="assets/site.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            isolation: isolate;
            overflow-x: hidden;
            color: #f4f8f5;
            background:
                radial-gradient(ellipse at 50% 38%, rgba(0, 141, 103, 0.2), transparent 48%),
                #07130f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            z-index: -1;
            top: 50%;
            left: 50%;
            width: min(78vw, 920px);
            aspect-ratio: 1;
            transform: translate(-50%, -50%) rotate(-14deg);
            background: url("assets/logo.png") center / contain no-repeat;
            opacity: 0.3;
            filter: drop-shadow(0 0 45px rgba(51, 218, 160, 0.13));
            pointer-events: none;
        }

        .primary-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: 650;
            transition: background-color 160ms ease, filter 160ms ease;
        }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            width: min(900px, calc(100% - 40px));
            margin: 0 auto;
            padding: 100px 0 120px;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .hero {
            max-width: 760px;
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 22px;
            padding: 8px 13px;
            border-radius: 999px;
            color: #45d7a6;
            background: rgba(0, 141, 103, 0.1);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 8vw, 5.8rem);
            line-height: 1.02;
            letter-spacing: -0.065em;
        }

        h1 span {
            color: #45d7a6;
        }

        .intro {
            max-width: 580px;
            margin: 24px auto 32px;
            color: #aabbb2;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.75;
        }

        .primary-link {
            padding: 14px 22px;
            filter: brightness(0.9);
        }

        @media (max-width: 520px) {
            body::before {
                top: 48%;
                left: 50%;
                width: 118vw;
                opacity: 0.2;
            }

            main {
                padding: 76px 0 90px;
            }
        }
    </style>
</head>
<body>
    <header class="site-navbar">
        <a class="site-brand" href="./" aria-label="Discography home">
            <img src="assets/logo.png" alt="">
            <span>DISCOGRAPHY</span>
        </a>
        <a class="site-nav-link action-link site-button" href="login/">Login</a>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">Your music, your story</p>
            <h1>Make your taste <span>your own.</span></h1>
            <p class="intro">Bring your favorite music together, shape a profile that feels like you, and share the sounds that make your world.</p>
            <a class="primary-link site-button" href="login/">Get started</a>
        </section>
    </main>

    <footer class="site-footer">Made for the music you love.</footer>
</body>
</html>
