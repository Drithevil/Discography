<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07130f">
    <title>Discography</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            isolation: isolate;
            overflow-x: hidden;
            color: #f4f8f5;
            background:
                radial-gradient(ellipse at 50% 38%, rgba(0, 141, 103, 0.2), transparent 48%),
                #07130f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            z-index: -1;
            top: 50%;
            left: 50%;
            width: min(78vw, 920px);
            aspect-ratio: 1;
            transform: translate(-50%, -50%) rotate(-14deg);
            background: url("assets/logo.png") center / contain no-repeat;
            opacity: 0.3;
            filter: drop-shadow(0 0 45px rgba(51, 218, 160, 0.13));
            pointer-events: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .navbar {
            position: relative;
            z-index: 1;
            width: 100%;
            margin: 0;
            padding: 12px max(24px, calc((100% - 1100px) / 2 + 16px));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 750;
            letter-spacing: 0.13em;
        }

        .brand img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
        }

        .login-link,
        .primary-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 10px;
            font-weight: 650;
            transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
        }

        .login-link {
            padding: 10px 16px;
            color: #e8f1ec;
            background: rgba(255, 255, 255, 0.04);
        }

        .login-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            width: min(900px, calc(100% - 40px));
            margin: 0 auto;
            padding: 100px 0 120px;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .hero {
            max-width: 760px;
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 22px;
            padding: 8px 13px;
            border-radius: 999px;
            color: #45d7a6;
            background: rgba(0, 141, 103, 0.1);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 8vw, 5.8rem);
            line-height: 1.02;
            letter-spacing: -0.065em;
        }

        h1 span {
            color: #45d7a6;
        }

        .intro {
            max-width: 580px;
            margin: 24px auto 32px;
            color: #aabbb2;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.75;
        }

        .primary-link {
            padding: 14px 22px;
            color: #052117;
            background: linear-gradient(100deg, #62e0ae, #26c48e);
            box-shadow: 0 8px 28px rgba(0, 190, 140, 0.2);
        }

        .primary-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 34px rgba(0, 190, 140, 0.3);
        }

        footer {
            position: relative;
            z-index: 1;
            padding: 20px 24px;
            color: #82938a;
            text-align: center;
            font-size: 0.85rem;
        }

        @media (max-width: 520px) {
            body::before {
                top: 48%;
                left: 50%;
                width: 118vw;
                opacity: 0.2;
            }

            .navbar {
                width: 100%;
                margin-top: 0;
                padding: 10px 14px;
            }

            .brand {
                gap: 9px;
                font-size: 0.78rem;
                letter-spacing: 0.1em;
            }

            .brand img {
                width: 34px;
                height: 34px;
            }

            .login-link {
                padding: 9px 12px;
                font-size: 0.9rem;
            }

            main {
                padding: 76px 0 90px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a class="brand" href="index.html" aria-label="Discography home">
            <img src="assets/logo.png" alt="">
            <span>DISCOGRAPHY</span>
        </a>
        <a class="login-link" href="login/index.html">Login <span aria-hidden="true">→</span></a>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">Your music, your story</p>
            <h1>Make your taste <span>your own.</span></h1>
            <p class="intro">Bring your favorite music together, shape a profile that feels like you, and share the sounds that make your world.</p>
            <a class="primary-link" href="login/index.html">Get started <span aria-hidden="true">→</span></a>
        </section>
    </main>

    <footer>Made for the music you love.</footer>
</body>
</html>
